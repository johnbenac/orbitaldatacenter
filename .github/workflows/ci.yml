name: CI

# Every pull request runs these checks. When all pass, auto-merge is enabled (rebase merge).
# Pull requests that touch a path in .github/CODEOWNERS also wait for the owner's approval, and a
# regression in the ratchet stops the merge until the owner decides.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @commitlint/cli@19 @commitlint/config-conventional@19
      - run: >-
          npx commitlint --verbose
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v

  static:
    name: release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-release.py
      - run: python3 scripts/build-site.py

  ratchet:
    name: regression ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/ratchet.py --lane fast

  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/build-site.py
      - run: python3 scripts/smoke-test.py --timeout 300

  gate:
    name: gate
    needs: [commits, unit, static, ratchet, smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c "import json,sys; sys.exit(0 if all(r in ('success','skipped') for r in json.load(sys.stdin)) else 1)"
      - name: Enable auto-merge
        if: >-
          github.event_name == 'pull_request' && !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --rebase "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
