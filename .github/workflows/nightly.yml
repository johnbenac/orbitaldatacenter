name: Nightly extended checks

# The long suites (engine model and the developer's full publication checks) run here, not on every
# pull request. A suite that passed in baseline.json and no longer passes opens an issue.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: python3 scripts/ratchet.py --lane extended --jobs 1
      - name: Report a regression
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly extended checks regressed"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" \
              --body "A suite that passed in baseline.json no longer passes. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
