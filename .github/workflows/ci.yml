name: CI

# Every pull request runs these checks. When all pass, auto-merge is enabled (rebase merge).
# Pull requests that touch a path in .github/CODEOWNERS also wait for the owner's approval, and a
# regression in the ratchet stops the merge until the owner decides.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund @commitlint/cli@19 @commitlint/config-conventional@19
      - run: >-
          npx commitlint --verbose
          --from "${{ github.event.pull_request.base.sha }}"
          --to "${{ github.event.pull_request.head.sha }}"

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v

  static:
    name: release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check-release.py
      - run: python3 scripts/build-site.py

  ratchet:
    name: regression ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/ratchet.py --lane fast

  smoke:
    name: browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python3 -m playwright install --with-deps chromium
      - run: python3 scripts/build-site.py
      - run: python3 scripts/smoke-test.py --timeout 300

  gate:
    name: gate
    needs: [commits, unit, static, ratchet, smoke]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | python3 -c "import json,sys; sys.exit(0 if all(r in ('success','skipped') for r in json.load(sys.stdin)) else 1)"
      # The ruleset requires one approval. The gate supplies it for pull requests whose checks passed,
      # which satisfies the count only: paths in .github/CODEOWNERS still need the owner's review.
      - name: Approve
        if: >-
          github.event_name == 'pull_request' && !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr review --approve "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "All CI checks passed."
      - name: Enable auto-merge
        if: >-
          github.event_name == 'pull_request' && !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --rebase "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

  deploy-after-merge:
    name: deploy after merge
    needs: gate
    if: >-
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      pull-requests: read
    steps:
      # A merge made by auto-merge does not start the push-triggered deploy, so wait for the merge
      # here and start the deploy explicitly. A pull request that waits longer than this for an
      # owner approval deploys through the push trigger when the owner merges it.
      - name: Wait for the merge, then start the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            state=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json state --jq .state)
            case "$state" in
              MERGED) gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main; exit 0 ;;
              CLOSED) echo "Closed without merging."; exit 0 ;;
            esac
            sleep 15
          done
          echo "Not merged within 30 minutes; the owner's merge starts the deploy through the push trigger."
